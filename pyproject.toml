[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aoi"
version = "0.1.0"
description = "Autonomous Opportunity Intelligence — human-supervised opportunity research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aisan Tafeem Amair" }]
dependencies = [
  "alembic>=1.16,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/aoi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
